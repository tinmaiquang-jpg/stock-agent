services:
  agent:
    build: .
    restart: unless-stopped
    env_file: .env
    # Chi mo cong ra localhost cua VPS; Caddy se reverse proxy vao day
    ports:
      - "127.0.0.1:8000:8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - agent

volumes:
  caddy_data:
  caddy_config:
