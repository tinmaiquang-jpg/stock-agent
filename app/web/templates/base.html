<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Stock Agent Admin{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --border: #d0d0d0; --muted: #666; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; line-height: 1.5; }
    header { border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex;
             gap: 16px; align-items: center; flex-wrap: wrap; }
    header a { text-decoration: none; font-weight: 500; }
    header form { margin-left: auto; }
    main { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }
    h1 { font-size: 1.4rem; margin-top: 0; }
    table { width: 100%; border-collapse: collapse; margin: 12px 0; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
    th { font-size: .85rem; text-transform: uppercase; color: var(--muted); }
    input, select, textarea, button { font: inherit; padding: 8px; }
    input, select, textarea { width: 100%; border: 1px solid var(--border); border-radius: 4px;
                              background: transparent; color: inherit; }
    textarea { min-height: 220px; font-family: ui-monospace, monospace; font-size: .9rem; }
    button { cursor: pointer; border: 1px solid var(--border); border-radius: 4px; }
    label { display: block; margin: 14px 0 4px; font-size: .9rem; font-weight: 500; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .row > * { flex: 1; min-width: 120px; }
    .cards { display: flex; gap: 16px; flex-wrap: wrap; }
    .card { border: 1px solid var(--border); border-radius: 8px; padding: 16px; flex: 1;
            min-width: 160px; }
    .card b { display: block; font-size: 1.8rem; }
    .ok { color: #0a7; font-weight: 500; }
    .muted { color: var(--muted); font-size: .9rem; }
    pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-size: .85rem; }
  </style>
</head>
<body>
  {% if request.session.get('admin_authenticated') %}
  <header>
    <a href="/">Dashboard</a>
    <a href="/config">Cau hinh</a>
    <a href="/watchlist">Watchlist</a>
    <a href="/alerts">Canh bao</a>
    <a href="/logs">Nhat ky</a>
    <form method="post" action="/logout"><button type="submit">Dang xuat</button></form>
  </header>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
