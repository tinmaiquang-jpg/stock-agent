[project]
name = "stock-agent"
version = "0.1.0"
description = "Tro ly chung khoan VN - Telegram bot + web admin, chay tren Vercel"
requires-python = ">=3.12"

# Vercel uu tien pyproject.toml hon requirements.txt. Day la bo day du de chay CA
# he thong tren Vercel (web admin + bot webhook + cron).
#
# Kich thuoc bundle: claude-agent-sdk ~273MB (co binary Claude Code) + pandas/numpy
# ~71MB + con lai ~30MB = ~375MB. Gioi han Python cua Vercel la 500MB nen vua.
#
# Khong co apscheduler va uvicorn: serverless khong chay job nen va khong tu chay
# server. Chay local/Docker thi dung requirements.txt (co day du).
dependencies = [
    "fastapi==0.141.1",
    "jinja2==3.1.4",
    "supabase==2.31.0",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.12",
    "pydantic-settings==2.5.2",
    "claude-agent-sdk==0.2.135",
    "python-telegram-bot==21.6",
    "vnstock==4.0.5",
    "tenacity==9.1.4",
    "pandas==2.3.3",
]

[tool.vercel]
entrypoint = "api.index:app"
